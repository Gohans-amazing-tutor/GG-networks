<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Red Dead Redemption</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

iframe{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    border:none;
    display:block;
}

button{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:#111;
    color:#fff;
    cursor:pointer;
    font-family:Arial,sans-serif;
}
</style>
</head>

<body>

<button onclick="fullscreenGame()">⛶ Fullscreen</button>

<iframe
id="game"
src="https://solitary-cell-b88d.cine-softwares.workers.dev/?url=https%3A%2F%2Fwww.raccoongame.com%2Flogin%3Fredirect_uri%3Dhttps%253A%252F%252Fsolitary-cell-b88d.cine-softwares.workers.dev%252Fautoplay%253Fgame_b64%253DaHR0cHM6Ly93d3cucmFjY29vbmdhbWUuY29tL3dhcC9kaXN0LyMvcGxhdGZvcm0vY2xvdWRnYW1lL2dhbWVkZXRhaWw%252FZ2lkPTEwNzMmbmFtZT1SZWQlMjBEZWFkJTIwUmVkZW1wdGlvbg%253D%253D&autocreate_name=Player%20880"
allow="fullscreen; autoplay; gamepad"
allowfullscreen>
</iframe>

<script>
function fullscreenGame(){
    const frame=document.getElementById("game");
    if(frame.requestFullscreen){
        frame.requestFullscreen();
    }else if(frame.webkitRequestFullscreen){
        frame.webkitRequestFullscreen();
    }else if(frame.msRequestFullscreen){
        frame.msRequestFullscreen();
    }
}
</script>

</body>
</html>
