<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GG networks — Unblocked Games</title>
  <link rel="icon" href="favicon.ico" />
  <meta name="theme-color" content="#000000" />

  <style>
    /* Space theme: black & white, animated starfield, netflix-style layout */
    :root{
      --bg:#000;
      --fg:#fff;
      --muted:#cfcfcf;
      --card-bg:#0a0a0a;
      --accent:#fff;
      --glass:rgba(255,255,255,0.03);
      --shadow:0 8px 40px rgba(0,0,0,0.6);
    }

    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}

    /* animated starfield */
    body{
      background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.02) 0%, transparent 40%), #000;
      overflow-y:auto;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .stars, .stars:after{
      position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:repeat;opacity:0.6;
    }
    .stars{
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 2px 2px;
      animation: move-stars 160s linear infinite;
      opacity:0.06;
    }
    .stars:after{
      content:"";background-image: radial-gradient(#fff 1px, transparent 1px);background-size:3px 3px;opacity:0.03;transform:translateZ(0);
    }
    @keyframes move-stars{from{background-position:0 0}to{background-position:10000px 5000px}}

    header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0.3));border-bottom:1px solid rgba(255,255,255,0.03)}
    .brand{display:flex;align-items:center;gap:12px}
    .logo-img{width:48px;height:48px;border-radius:6px;background:#111;display:block;object-fit:contain;border:1px solid rgba(255,255,255,0.04)}
    .site-name{font-weight:800;letter-spacing:0.6px;font-size:18px}

    .search-wrap{flex:1;display:flex;justify-content:center;padding:0 20px}
    .search{width:min(720px,70%);display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:10px;padding:8px 12px;border:1px solid rgba(255,255,255,0.04);box-shadow:var(--shadow)}
    .search input{flex:1;background:transparent;border:0;color:var(--fg);outline:none;font-size:15px;padding:6px}

    main{position:relative;z-index:10;padding:28px}
    .row{margin-bottom:32px}
    .row-title{font-size:20px;margin:8px 0 14px 4px;color:var(--muted);font-weight:700}
    .row-cards{display:flex;gap:18px;overflow:auto;padding:6px 6px 12px 6px;scroll-behavior:smooth}

    /* Bigger Netflix-style poster cards */
    .card{min-width:420px;height:260px;background:linear-gradient(#0b0b0b,#070707);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,0.04);cursor:pointer;flex:0 0 auto;transition:transform .18s ease}
    .card:hover{transform:translateY(-12px) scale(1.04)}
    .card-thumb{background:#000;border-radius:10px;height:170px;background-position:center;background-size:cover;border:1px solid rgba(255,255,255,0.02);box-shadow:0 12px 50px rgba(0,0,0,0.7)}
    .card-title{font-size:18px;margin-top:12px;font-weight:800;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-meta{font-size:14px;color:var(--muted)}

    /* fullscreen container */
    .fs-container{display:none;position:fixed;inset:0;z-index:1000;background:#000}
    .fs-container.open{display:block}
    .fs-container iframe{width:100%;height:100%;border:0;background:#000}

    @media (max-width:1200px){ .card{min-width:340px;height:220px} .card-thumb{height:140px} }
    @media (max-width:900px){ .card{min-width:300px;height:200px} .card-thumb{height:120px} }
    @media (max-width:720px){.card{min-width:220px;height:160px}.card-thumb{height:100px}} 

    ::-webkit-scrollbar{height:10px;width:10px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.04);border-radius:100px}

    .empty-state{padding:28px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header>
    <div class="brand">
      <img src="favicon.ico" alt="GG networks" class="logo-img" id="siteLogo" onerror="this.style.display='none'" />
      <div class="site-name">GG networks</div>
    </div>

    <div class="search-wrap">
      <div class="search" role="search" aria-label="Search games">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:.7"><path d="M21 21l-4.35-4.35" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="searchInput" placeholder="Search games, categories..." />
        <button id="clearSearch" title="Clear" style="background:transparent;border:0;color:var(--muted);cursor:pointer">✕</button>
      </div>
    </div>

    <div style="width:56px"></div>
  </header>

  <main>
    <div id="rowsContainer" aria-live="polite"></div>
  </main>

  <!-- Fullscreen player container -->
  <div class="fs-container" id="fsContainer" aria-hidden="true">
    <iframe id="fsFrame" allowfullscreen></iframe>
  </div>

  <script>
    const rowsContainer = document.getElementById('rowsContainer');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const fsContainer = document.getElementById('fsContainer');
    const fsFrame = document.getElementById('fsFrame');

    let layout = [];
    let grouped = {};

    async function loadLayout(){
      try{
        const res = await fetch('layout.json', {cache:'no-store'});
        if(!res.ok) throw new Error('layout.json not found');
        layout = await res.json();
        if(!Array.isArray(layout)) layout = [];
      }catch(e){
        console.warn('Could not load layout.json or it is invalid.', e);
        layout = [];
      }
      buildRows();
    }

    function groupByCategory(){
      grouped = {};
      for(const g of layout){
        const cat = g.category || 'Other';
        if(!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(g);
      }
    }

    function buildCard(game){
      const el = document.createElement('div');
      el.className = 'card';
      el.tabIndex = 0;
      el.setAttribute('role','button');
      el.innerHTML = `
        <div class="card-thumb" style="background-image:url('${escapeHtml(game.thumbnail || '')}');" aria-hidden="true"></div>
        <div>
          <div class="card-title">${escapeHtml(game.title)}</div>
          <div class="card-meta">${escapeHtml(game.category || '')}</div>
        </div>
      `;
      el.addEventListener('click', ()=> playFullscreen(game));
      el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') playFullscreen(game); });
      return el;
    }

    function buildRows(filter=''){
      groupByCategory();
      rowsContainer.innerHTML = '';
      const q = (filter||'').trim().toLowerCase();

      if(layout.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `<h2 style="margin:0 0 8px 0;">No games found</h2><p style="margin:0">Populate <code>layout.json</code> with your games (title, thumbnail, src, category) and reload.</p>`;
        rowsContainer.appendChild(empty);
        return;
      }

      const seen = new Set();
      const orderedCats = [];
      for(const g of layout){ if(!seen.has(g.category)){ orderedCats.push(g.category || 'Other'); seen.add(g.category); } }

      for(const cat of orderedCats){
        const items = (grouped[cat]||[]).filter(g => !q || (g.title||'').toLowerCase().includes(q) || (g.category||'').toLowerCase().includes(q));
        if(items.length===0) continue;
        const row = document.createElement('section');
        row.className = 'row';
        row.innerHTML = `<div class="row-title">${escapeHtml(cat)}</div><div class="row-cards"></div>`;
        const cards = row.querySelector('.row-cards');
        for(const item of items){ cards.appendChild(buildCard(item)); }
        rowsContainer.appendChild(row);
      }
    }

    function playFullscreen(game){
      const src = (game.src || '').trim();
      if(!src){
        alert('No game source specified for ' + (game.title||''));
        return;
      }

      fsFrame.src = src;
      fsContainer.classList.add('open');
      fsContainer.setAttribute('aria-hidden','false');

      const el = fsContainer;
      const request = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if(request){
        try{ request.call(el); }
        catch(e){ console.warn('Fullscreen request failed', e); }
      }

      setTimeout(()=>{ try{ fsFrame.contentWindow && fsFrame.contentWindow.focus(); }catch(e){} }, 500);
    }

    function onFullScreenChange(){
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if(!fsEl){
        fsFrame.src = 'about:blank';
        fsContainer.classList.remove('open');
        fsContainer.setAttribute('aria-hidden','true');
      }
    }
    document.addEventListener('fullscreenchange', onFullScreenChange);
    document.addEventListener('webkitfullscreenchange', onFullScreenChange);
    document.addEventListener('mozfullscreenchange', onFullScreenChange);

    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        if(!fsEl){
          fsFrame.src = 'about:blank';
          fsContainer.classList.remove('open');
          fsContainer.setAttribute('aria-hidden','true');
        }
      }
    });

    searchInput.addEventListener('input', ()=>{ buildRows(searchInput.value); });
    clearSearch.addEventListener('click', ()=>{ searchInput.value=''; buildRows(''); });

    function escapeHtml(s){ if(!s && s!==0) return ''; return (''+s).replace(/[&<>"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }

    loadLayout();

    window.GG = { reloadLayout: loadLayout };
  </script>
</body>
</html>
