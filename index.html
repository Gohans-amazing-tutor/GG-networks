<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GG networks — Unblocked Games</title>
  <style>
    :root { --bg:#000; --fg:#fff; --muted:#cfcfcf; --card-bg:#0a0a0a; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,Arial}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(0,0,0,0.6)}
    .site-name{font-weight:700}
    main{padding:20px}
    .rows{display:flex;flex-direction:column;gap:24px}
    .row-cards{display:flex;gap:12px;overflow:auto;padding:6px}
    .card{min-width:220px;background:var(--card-bg);border-radius:8px;padding:10px;cursor:pointer}
    .card-thumb{height:120px;background:#111;border-radius:6px;background-size:cover;background-position:center}

    /* Modal / popup styles */
    .fs-container{display:none;position:fixed;inset:0;z-index:1000}
    .fs-container.open{display:block}
    .fs-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.7)}
    .fs-inner{position:absolute;inset:5% 7%;background:#000;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.6);display:flex;flex-direction:column}
    .fs-inner iframe{width:100%;height:100%;border:0;background:#000}
    .fs-close{position:absolute;right:12px;top:10px;z-index:3;padding:8px 12px;border-radius:6px;border:none;background:rgba(255,255,255,0.06);color:#fff;cursor:pointer}

    .empty-state{color:var(--muted);padding:20px}
    .live-link{color:#9fd6ff;text-decoration:none;border:1px solid rgba(255,255,255,0.06);padding:6px 10px;border-radius:8px}
  </style>
</head>
<body>
  <header>
    <div class="site-name">GG networks</div>
    <div>
      <a class="live-link" href="https://gohans-amazing-tutor.github.io/GG-networks/" target="_blank" rel="noopener">View live (Pages)</a>
    </div>
  </header>

  <main>
    <div id="rowsContainer" class="rows"></div>
  </main>

  <!-- Popup container used to show the game inside an iframe -->
  <div class="fs-container" id="fsContainer" aria-hidden="true">
    <div class="fs-backdrop" id="fsBackdrop"></div>
    <div class="fs-inner" role="dialog" aria-modal="true">
      <button id="fsClose" class="fs-close" aria-label="Close">✕</button>
      <iframe id="fsFrame" allowfullscreen sandbox="allow-scripts allow-forms allow-pointer-lock allow-modals"></iframe>
    </div>
  </div>

  <script>
    const rowsContainer = document.getElementById('rowsContainer');
    const fsContainer = document.getElementById('fsContainer');
    const fsBackdrop = document.getElementById('fsBackdrop');
    const fsFrame = document.getElementById('fsFrame');
    const fsCloseBtn = document.getElementById('fsClose');
    let layout = [];

    async function loadLayout(){
      try{
        const res = await fetch('layout.json', {cache:'no-store'});
        if(!res.ok) throw new Error('layout.json not found');
        layout = await res.json();
        if(!Array.isArray(layout)) layout = [];
      }catch(e){
        console.warn('Could not load layout.json or it is invalid.', e);
        layout = [];
      }
      buildRows();
    }

    function escapeHtml(s){ if(!s && s!==0) return ''; return (''+s).replace(/[&<>"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }

    function buildCard(game){
      const el = document.createElement('div');
      el.className = 'card';
      el.tabIndex = 0;
      el.setAttribute('role','button');
      el.innerHTML = `
        <div class="card-thumb" style="background-image:url('${escapeHtml(game.thumbnail||'')}')"></div>
        <div style="margin-top:8px;font-weight:700">${escapeHtml(game.title||'Untitled')}</div>
        <div style="color:var(--muted);font-size:13px">${escapeHtml(game.category||'')}</div>
      `;
      el.addEventListener('click', ()=> playFullscreen(game));
      el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') playFullscreen(game); });
      return el;
    }

    function buildRows(){
      rowsContainer.innerHTML = '';
      if(!layout || layout.length===0){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No games found — add layout.json with title, thumbnail, src, category.';
        rowsContainer.appendChild(empty);
        return;
      }

      const row = document.createElement('section');
      row.className = 'row';
      const cards = document.createElement('div');
      cards.className = 'row-cards';
      for(const g of layout){ cards.appendChild(buildCard(g)); }
      row.appendChild(cards);
      rowsContainer.appendChild(row);
    }

    // New: open game inside modal popup iframe
    function playFullscreen(game){
      const src = (game.src||'').trim();
      if(!src){ alert('No game source specified for ' + (game.title||'')); return; }

      // Show modal and set iframe src. Relative paths (like "GAMES/...") will resolve correctly.
      try{
        fsFrame.src = src;
        fsContainer.classList.add('open');
        fsContainer.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
      }catch(e){
        console.warn('Failed to embed game, opening in new tab as fallback', e);
        // Fallback: open in a new tab on our domain's player page so address stays on our site
        const encoded = (()=>{ try{ return encodeURIComponent(btoa(src)); }catch(e){ return null; } })();
        if(encoded){
          const a = document.createElement('a');
          a.href = '/player.html?u=' + encoded;
          a.target = '_blank';
          a.rel = 'noopener';
          document.body.appendChild(a);
          a.click();
          a.remove();
          return;
        }
        window.open(src, '_blank', 'noopener');
      }
    }

    function closeFs(){
      try{ fsFrame.src = 'about:blank'; }catch(e){}
      fsContainer.classList.remove('open');
      fsContainer.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    // Close handlers
    fsCloseBtn.addEventListener('click', closeFs);
    fsBackdrop.addEventListener('click', closeFs);
    // click outside inner content
    fsContainer.addEventListener('click', (e)=>{ if(e.target === fsContainer) closeFs(); });

    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape'){
        // if not in browser fullscreen, close modal
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
        if(!fsEl) closeFs();
      }
    });

    // Keep existing fullscreenchange listener to clear iframe when leaving fullscreen
    function onFullScreenChange(){
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      if(!fsEl){ closeFs(); }
    }
    document.addEventListener('fullscreenchange', onFullScreenChange);
    document.addEventListener('webkitfullscreenchange', onFullScreenChange);
    document.addEventListener('mozfullscreenchange', onFullScreenChange);

    loadLayout();

    window.GG = { reloadLayout: loadLayout };
  </script>
</body>
</html>
